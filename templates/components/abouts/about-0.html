<!-- about-0: Story text left + key stats bar right | All niches -->
<section id="about" class="ts-about0" data-block="about-0" aria-label="About">
  <div class="ts-about0__container">
    <div class="ts-about0__content">
      <span class="ts-section-label" data-editable="about_label">[about_label]</span>
      <h2 class="ts-section-title" data-editable="about_title">[about_title]</h2>
      <p class="ts-about0__text" data-editable="about_text_1">[about_text_1]</p>
      <p class="ts-about0__text" data-editable="about_text_2">[about_text_2]</p>
      <a href="#contact" class="ts-btn ts-btn--primary" data-editable="about_cta">[about_cta]</a>
    </div>
    <div class="ts-about0__stats">
      <div class="ts-about0__stat">
        <span class="ts-about0__stat-num" data-editable="stat_1_num">[stat_1_num]</span>
        <span class="ts-about0__stat-label" data-editable="stat_1_label">[stat_1_label]</span>
      </div>
      <div class="ts-about0__stat">
        <span class="ts-about0__stat-num" data-editable="stat_2_num">[stat_2_num]</span>
        <span class="ts-about0__stat-label" data-editable="stat_2_label">[stat_2_label]</span>
      </div>
      <div class="ts-about0__stat">
        <span class="ts-about0__stat-num" data-editable="stat_3_num">[stat_3_num]</span>
        <span class="ts-about0__stat-label" data-editable="stat_3_label">[stat_3_label]</span>
      </div>
      <div class="ts-about0__stat">
        <span class="ts-about0__stat-num" data-editable="stat_4_num">[stat_4_num]</span>
        <span class="ts-about0__stat-label" data-editable="stat_4_label">[stat_4_label]</span>
      </div>
      <div class="ts-about0__visual">
        <img src="[about_image_url]" alt="[about_image_alt]" class="ts-about0__img"
          data-editable="about_image_url" data-editable-type="image" />
      </div>
    </div>
  </div>
</section>
<style>
.ts-about0 { background: var(--color-bg); padding: var(--spacing-section) var(--spacing-6); }
.ts-about0__container { max-width: var(--container-max); margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-16); align-items: start; }
.ts-section-label { display: block; font-family: var(--font-body); font-size: var(--font-size-xs); font-weight: var(--font-weight-bold); color: var(--color-primary); letter-spacing: var(--letter-spacing-wider); text-transform: uppercase; margin-bottom: var(--spacing-4); }
.ts-section-title { font-family: var(--font-headers); font-size: clamp(1.8rem, 3.5vw, 2.8rem); font-weight: var(--font-weight-black); color: var(--color-text); line-height: var(--line-height-tight); margin: 0 0 var(--spacing-6); }
.ts-about0__text { font-family: var(--font-body); font-size: var(--font-size-base); color: var(--color-text-muted); line-height: var(--line-height-relaxed); margin: 0 0 var(--spacing-5); }
.ts-about0__stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-6); }
.ts-about0__stat { background: var(--color-surface); border-radius: var(--radius-card); padding: var(--spacing-6); box-shadow: var(--shadow-sm); border: 1px solid var(--color-border); text-align: center; }
.ts-about0__stat-num { display: block; font-family: var(--font-headers); font-size: var(--font-size-4xl); font-weight: var(--font-weight-black); color: var(--color-primary); line-height: 1; margin-bottom: var(--spacing-2); }
.ts-about0__stat-label { font-family: var(--font-body); font-size: var(--font-size-sm); color: var(--color-text-muted); }
.ts-about0__visual { grid-column: 1 / -1; }
.ts-about0__img { width: 100%; height: 200px; object-fit: cover; border-radius: var(--radius-card); }
@media (max-width: 768px) { .ts-about0__container { grid-template-columns: 1fr; gap: var(--spacing-10); } }
</style>

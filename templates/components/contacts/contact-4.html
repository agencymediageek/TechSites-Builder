<!-- contact-4: Testimonials + simple form side by side | Trust-heavy -->
<section id="contact" class="ts-contact4" data-block="contact-4" aria-label="Contact">
  <div class="ts-contact4__container">
    <div class="ts-contact4__testimonials">
      <span class="ts-section-label" data-editable="contact_label">[contact_label]</span>
      <h2 class="ts-section-title" data-editable="contact_title">[contact_title]</h2>
      <div class="ts-contact4__stars">⭐⭐⭐⭐⭐</div>
      <div class="ts-contact4__reviews">
        <div class="ts-contact4__review">
          <p class="ts-contact4__review-text" data-editable="review_1_text">"[review_1_text]"</p>
          <div class="ts-contact4__reviewer">
            <img src="[review_1_photo]" alt="[review_1_name]" class="ts-contact4__reviewer-photo" data-editable="review_1_photo" data-editable-type="image" />
            <div><strong data-editable="review_1_name">[review_1_name]</strong><span data-editable="review_1_role">[review_1_role]</span></div>
          </div>
        </div>
        <div class="ts-contact4__review">
          <p class="ts-contact4__review-text" data-editable="review_2_text">"[review_2_text]"</p>
          <div class="ts-contact4__reviewer">
            <img src="[review_2_photo]" alt="[review_2_name]" class="ts-contact4__reviewer-photo" data-editable="review_2_photo" data-editable-type="image" />
            <div><strong data-editable="review_2_name">[review_2_name]</strong><span data-editable="review_2_role">[review_2_role]</span></div>
          </div>
        </div>
        <div class="ts-contact4__review">
          <p class="ts-contact4__review-text" data-editable="review_3_text">"[review_3_text]"</p>
          <div class="ts-contact4__reviewer">
            <img src="[review_3_photo]" alt="[review_3_name]" class="ts-contact4__reviewer-photo" data-editable="review_3_photo" data-editable-type="image" />
            <div><strong data-editable="review_3_name">[review_3_name]</strong><span data-editable="review_3_role">[review_3_role]</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="ts-contact4__form-col">
      <div class="ts-contact4__form-card">
        <h3 class="ts-contact4__form-title" data-editable="form_title">[form_title]</h3>
        <form onsubmit="return false;">
          <div class="ts-form-group"><label class="ts-form-label" data-editable="label_name">[label_name]</label><input type="text" class="ts-form-input" required /></div>
          <div class="ts-form-group"><label class="ts-form-label" data-editable="label_email">[label_email]</label><input type="email" class="ts-form-input" required /></div>
          <div class="ts-form-group"><label class="ts-form-label" data-editable="label_phone">[label_phone]</label><input type="tel" class="ts-form-input" /></div>
          <div class="ts-form-group"><label class="ts-form-label" data-editable="label_service">[label_service]</label>
            <select class="ts-form-input">
              <option value="" disabled selected>[placeholder_service]</option>
              <option data-editable="service_opt_1">[service_opt_1]</option>
              <option data-editable="service_opt_2">[service_opt_2]</option>
              <option data-editable="service_opt_3">[service_opt_3]</option>
            </select>
          </div>
          <div class="ts-form-group"><label class="ts-form-label" data-editable="label_message">[label_message]</label><textarea class="ts-form-input ts-form-textarea" rows="4"></textarea></div>
          <button type="submit" class="ts-btn ts-btn--primary" style="width:100%" data-editable="contact_cta">[contact_cta]</button>
        </form>
        <div class="ts-contact4__guarantees">
          <span>🔒 <span data-editable="guarantee_1">[guarantee_1]</span></span>
          <span>⚡ <span data-editable="guarantee_2">[guarantee_2]</span></span>
        </div>
      </div>
    </div>
  </div>
</section>
<style>
.ts-contact4 { background: var(--color-bg-alt); padding: var(--spacing-section) var(--spacing-6); }
.ts-contact4__container { max-width: var(--container-max); margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-12); align-items: start; }
.ts-contact4__stars { font-size: 1.5rem; margin-bottom: var(--spacing-8); display: block; }
.ts-contact4__reviews { display: flex; flex-direction: column; gap: var(--spacing-6); }
.ts-contact4__review { background: var(--color-surface); border-radius: var(--radius-card); border: 1px solid var(--color-border); padding: var(--spacing-6); }
.ts-contact4__review-text { font-family: var(--font-body); font-size: var(--font-size-base); color: var(--color-text); font-style: italic; line-height: var(--line-height-relaxed); margin: 0 0 var(--spacing-5); }
.ts-contact4__reviewer { display: flex; align-items: center; gap: var(--spacing-4); }
.ts-contact4__reviewer-photo { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
.ts-contact4__reviewer strong { display: block; font-family: var(--font-headers); font-size: var(--font-size-base); font-weight: var(--font-weight-bold); color: var(--color-text); }
.ts-contact4__reviewer span { font-family: var(--font-body); font-size: var(--font-size-xs); color: var(--color-text-muted); }
.ts-contact4__form-card { background: var(--color-surface); border-radius: var(--radius-card); border: 1px solid var(--color-border); padding: var(--spacing-8); box-shadow: var(--shadow-xl); position: sticky; top: 100px; }
.ts-contact4__form-title { font-family: var(--font-headers); font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold); color: var(--color-text); margin: 0 0 var(--spacing-7); }
.ts-contact4__guarantees { display: flex; gap: var(--spacing-5); margin-top: var(--spacing-5); padding-top: var(--spacing-5); border-top: 1px solid var(--color-border); }
.ts-contact4__guarantees span { font-family: var(--font-body); font-size: var(--font-size-xs); color: var(--color-text-muted); }
@media (max-width: 768px) { .ts-contact4__container { grid-template-columns: 1fr; } .ts-contact4__form-card { position: static; } }
</style>

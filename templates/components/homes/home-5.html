<!-- home-5: Full-screen video background | Minimal text | Large CTA + quote -->
<!-- NICHE: Restaurant, Hotel, Fitness, Events | STYLE: Cinematic video bg -->
<section id="home" class="ts-home5" data-block="home-5" aria-label="Hero">
  <div class="ts-home5__media">
    <!-- Video bg — fallback to image if video can't load -->
    <video class="ts-home5__video" autoplay muted loop playsinline
      poster="[hero_image_url]"
      aria-hidden="true">
      <source src="[hero_video_url]" type="video/mp4" />
    </video>
    <img src="[hero_image_url]" alt="" class="ts-home5__fallback"
      data-editable="hero_image_url" data-editable-type="image" data-editable-label="Hero Background Image" />
    <div class="ts-home5__overlay"></div>
  </div>
  <div class="ts-home5__content">
    <h1 class="ts-home5__title" data-editable="hero_title">[hero_title]</h1>
    <p class="ts-home5__tagline" data-editable="hero_subtitle">[hero_subtitle]</p>
    <a href="#contact" class="ts-btn ts-btn--accent ts-btn--lg ts-home5__cta" data-editable="hero_cta_primary">[hero_cta_primary]</a>
  </div>
  <div class="ts-home5__awards" aria-label="Recognition">
    <div class="ts-home5__award" data-editable="award_1">[award_1]</div>
    <div class="ts-home5__award-div"></div>
    <div class="ts-home5__award" data-editable="award_2">[award_2]</div>
    <div class="ts-home5__award-div"></div>
    <div class="ts-home5__award" data-editable="award_3">[award_3]</div>
  </div>
  <button class="ts-home5__mute-btn" aria-label="Toggle sound">🔇</button>
</section>

<style>
.ts-home5 {
  position: relative; height: 100vh; min-height: 600px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  overflow: hidden; text-align: center;
}
.ts-home5__media { position: absolute; inset: 0; z-index: 0; }
.ts-home5__video {
  width: 100%; height: 100%; object-fit: cover;
  position: absolute; inset: 0;
}
.ts-home5__fallback {
  width: 100%; height: 100%; object-fit: cover;
  position: absolute; inset: 0; z-index: -1;
}
.ts-home5__overlay {
  position: absolute; inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.35) 0%,
    var(--color-overlay) 60%,
    rgba(0,0,0,0.70) 100%
  );
}
.ts-home5__content {
  position: relative; z-index: 1;
  max-width: var(--container-narrow); padding: 0 var(--spacing-6);
}
.ts-home5__title {
  font-family: var(--font-headers); font-size: clamp(3rem, 8vw, 6rem);
  font-weight: var(--font-weight-black); color: var(--color-text-inverse);
  line-height: 1; letter-spacing: var(--letter-spacing-tight); margin: 0 0 var(--spacing-5);
}
.ts-home5__tagline {
  font-family: var(--font-body); font-size: var(--font-size-xl);
  color: rgba(255,255,255,0.85); line-height: var(--line-height-normal);
  margin: 0 0 var(--spacing-8); font-style: italic;
}
.ts-home5__cta { letter-spacing: var(--letter-spacing-wide); text-transform: uppercase; font-size: var(--font-size-sm) !important; }
.ts-home5__awards {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 1;
  display: flex; align-items: center; justify-content: center; gap: var(--spacing-6);
  padding: var(--spacing-5) var(--spacing-6);
  background: rgba(0,0,0,0.45); backdrop-filter: blur(8px);
  border-top: 1px solid rgba(255,255,255,0.12);
}
.ts-home5__award {
  font-family: var(--font-body); font-size: var(--font-size-xs);
  color: rgba(255,255,255,0.80); font-weight: var(--font-weight-medium);
  letter-spacing: var(--letter-spacing-wide); text-transform: uppercase;
  text-align: center;
}
.ts-home5__award-div { width: 1px; height: 24px; background: rgba(255,255,255,0.25); }
.ts-home5__mute-btn {
  position: absolute; bottom: calc(var(--spacing-10) + 48px); right: var(--spacing-6);
  z-index: 2; background: rgba(0,0,0,0.50); border: none; color: white;
  width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 16px;
  backdrop-filter: blur(8px); transition: background var(--transition-fast);
}
.ts-home5__mute-btn:hover { background: rgba(0,0,0,0.75); }
@media (max-width: 768px) {
  .ts-home5__awards { gap: var(--spacing-3); flex-wrap: wrap; }
  .ts-home5__award-div { display: none; }
  .ts-home5__mute-btn { display: none; }
}
</style>

<script>
(function() {
  const video = document.querySelector('.ts-home5__video');
  const muteBtn = document.querySelector('.ts-home5__mute-btn');
  if (!video || !muteBtn) return;
  muteBtn.addEventListener('click', function() {
    video.muted = !video.muted;
    muteBtn.textContent = video.muted ? '🔇' : '🔊';
  });
})();
</script>

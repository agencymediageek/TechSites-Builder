<!-- howto-0: 3-step horizontal with icons | Clean, all niches -->
<section id="services" class="ts-howto0" data-block="howto-0" aria-label="How It Works">
  <div class="ts-howto0__container">
    <div class="ts-howto0__header">
      <span class="ts-section-label" data-editable="howto_label">[howto_label]</span>
      <h2 class="ts-section-title" data-editable="howto_title">[howto_title]</h2>
      <p class="ts-howto0__intro" data-editable="howto_intro">[howto_intro]</p>
    </div>
    <div class="ts-howto0__steps">
      <div class="ts-howto0__step">
        <div class="ts-howto0__icon-wrap"><span class="ts-howto0__icon" data-editable="step_1_icon">[step_1_icon]</span></div>
        <div class="ts-howto0__num">01</div>
        <h3 class="ts-howto0__step-title" data-editable="step_1_title">[step_1_title]</h3>
        <p class="ts-howto0__step-text" data-editable="step_1_text">[step_1_text]</p>
      </div>
      <div class="ts-howto0__connector" aria-hidden="true">→</div>
      <div class="ts-howto0__step">
        <div class="ts-howto0__icon-wrap"><span class="ts-howto0__icon" data-editable="step_2_icon">[step_2_icon]</span></div>
        <div class="ts-howto0__num">02</div>
        <h3 class="ts-howto0__step-title" data-editable="step_2_title">[step_2_title]</h3>
        <p class="ts-howto0__step-text" data-editable="step_2_text">[step_2_text]</p>
      </div>
      <div class="ts-howto0__connector" aria-hidden="true">→</div>
      <div class="ts-howto0__step">
        <div class="ts-howto0__icon-wrap ts-howto0__icon-wrap--accent"><span class="ts-howto0__icon" data-editable="step_3_icon">[step_3_icon]</span></div>
        <div class="ts-howto0__num ts-howto0__num--accent">03</div>
        <h3 class="ts-howto0__step-title" data-editable="step_3_title">[step_3_title]</h3>
        <p class="ts-howto0__step-text" data-editable="step_3_text">[step_3_text]</p>
      </div>
    </div>
    <div class="ts-howto0__cta-wrap">
      <a href="#contact" class="ts-btn ts-btn--primary ts-btn--lg" data-editable="howto_cta">[howto_cta]</a>
    </div>
  </div>
</section>
<style>

<!-- howto-1: Numbered vertical list with descriptions + image right -->
<section id="services" class="ts-howto1" data-block="howto-1" aria-label="Our Process">
  <div class="ts-howto1__container">
    <div class="ts-howto1__content">
      <span class="ts-section-label" data-editable="howto_label">[howto_label]</span>
      <h2 class="ts-section-title" data-editable="howto_title">[howto_title]</h2>
      <p class="ts-howto1__intro" data-editable="howto_intro">[howto_intro]</p>
      <div class="ts-howto1__steps">
        <div class="ts-howto1__step"><div class="ts-howto1__num">1</div><div><h3 class="ts-howto1__step-title" data-editable="step_1_title">[step_1_title]</h3><p class="ts-howto1__step-text" data-editable="step_1_text">[step_1_text]</p></div></div>
        <div class="ts-howto1__step"><div class="ts-howto1__num">2</div><div><h3 class="ts-howto1__step-title" data-editable="step_2_title">[step_2_title]</h3><p class="ts-howto1__step-text" data-editable="step_2_text">[step_2_text]</p></div></div>
        <div class="ts-howto1__step"><div class="ts-howto1__num">3</div><div><h3 class="ts-howto1__step-title" data-editable="step_3_title">[step_3_title]</h3><p class="ts-howto1__step-text" data-editable="step_3_text">[step_3_text]</p></div></div>
        <div class="ts-howto1__step"><div class="ts-howto1__num">4</div><div><h3 class="ts-howto1__step-title" data-editable="step_4_title">[step_4_title]</h3><p class="ts-howto1__step-text" data-editable="step_4_text">[step_4_text]</p></div></div>
      </div>
      <a href="#contact" class="ts-btn ts-btn--primary" data-editable="howto_cta">[howto_cta]</a>
    </div>
    <div class="ts-howto1__visual">
      <img src="[howto_image_url]" alt="[howto_image_alt]" class="ts-howto1__img" data-editable="howto_image_url" data-editable-type="image" />
      <div class="ts-howto1__badge"><strong data-editable="howto_badge_num">[howto_badge_num]</strong><span data-editable="howto_badge_text">[howto_badge_text]</span></div>
    </div>
  </div>
</section>
<style>
.ts-howto1 { background: var(--color-bg); padding: var(--spacing-section) var(--spacing-6); }
.ts-howto1__container { max-width: var(--container-max); margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-16); align-items: center; }
.ts-howto1__intro { font-family: var(--font-body); font-size: var(--font-size-lg); color: var(--color-text-muted); line-height: var(--line-height-relaxed); margin: 0 0 var(--spacing-8); }
.ts-howto1__steps { display: flex; flex-direction: column; gap: var(--spacing-6); margin-bottom: var(--spacing-8); }
.ts-howto1__step { display: flex; gap: var(--spacing-5); }
.ts-howto1__num { width: 36px; height: 36px; border-radius: var(--radius-circle); background: var(--color-primary); color: var(--color-text-inverse); font-family: var(--font-headers); font-size: var(--font-size-sm); font-weight: var(--font-weight-black); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
.ts-howto1__step-title { font-family: var(--font-headers); font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--color-text); margin: 0 0 var(--spacing-2); }
.ts-howto1__step-text { font-family: var(--font-body); font-size: var(--font-size-base); color: var(--color-text-muted); line-height: var(--line-height-relaxed); margin: 0; }
.ts-howto1__visual { position: relative; }
.ts-howto1__img { width: 100%; height: 500px; object-fit: cover; border-radius: var(--radius-card); box-shadow: var(--shadow-xl); }
.ts-howto1__badge { position: absolute; bottom: var(--spacing-6); left: var(--spacing-6); background: var(--color-surface); border-radius: var(--radius-card); padding: var(--spacing-4) var(--spacing-5); box-shadow: var(--shadow-lg); text-align: center; }
.ts-howto1__badge strong { display: block; font-family: var(--font-headers); font-size: var(--font-size-2xl); font-weight: var(--font-weight-black); color: var(--color-primary); }
.ts-howto1__badge span { font-family: var(--font-body); font-size: var(--font-size-sm); color: var(--color-text-muted); }
@media (max-width: 768px) { .ts-howto1__container { grid-template-columns: 1fr; } .ts-howto1__visual { display: none; } }
</style>

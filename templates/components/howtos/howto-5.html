<!-- howto-5: Video embed + text steps | Tutorial, Health, Fitness -->
<section id="services" class="ts-howto5" data-block="howto-5" aria-label="Learn How">
  <div class="ts-howto5__container">
    <div class="ts-howto5__header">
      <span class="ts-section-label" data-editable="howto_label">[howto_label]</span>
      <h2 class="ts-section-title" data-editable="howto_title">[howto_title]</h2>
    </div>
    <div class="ts-howto5__layout">
      <div class="ts-howto5__video-col">
        <div class="ts-howto5__video-wrap">
          <iframe class="ts-howto5__iframe" src="[video_embed_url]" title="[video_title]" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy" data-editable="video_embed_url" data-editable-type="link"></iframe>
          <div class="ts-howto5__video-thumb" id="ts-video-thumb">
            <img src="[video_thumb_url]" alt="[video_title]" data-editable="video_thumb_url" data-editable-type="image" />
            <button class="ts-howto5__play-btn" aria-label="Play video">▶</button>
          </div>
        </div>
        <p class="ts-howto5__video-caption" data-editable="video_caption">[video_caption]</p>
      </div>
      <div class="ts-howto5__steps-col">
        <p class="ts-howto5__intro" data-editable="howto_intro">[howto_intro]</p>
        <ol class="ts-howto5__steps">
          <li class="ts-howto5__step"><span class="ts-howto5__step-title" data-editable="step_1_title">[step_1_title]</span><span class="ts-howto5__step-text" data-editable="step_1_text">[step_1_text]</span></li>
          <li class="ts-howto5__step"><span class="ts-howto5__step-title" data-editable="step_2_title">[step_2_title]</span><span class="ts-howto5__step-text" data-editable="step_2_text">[step_2_text]</span></li>
          <li class="ts-howto5__step"><span class="ts-howto5__step-title" data-editable="step_3_title">[step_3_title]</span><span class="ts-howto5__step-text" data-editable="step_3_text">[step_3_text]</span></li>
          <li class="ts-howto5__step"><span class="ts-howto5__step-title" data-editable="step_4_title">[step_4_title]</span><span class="ts-howto5__step-text" data-editable="step_4_text">[step_4_text]</span></li>
          <li class="ts-howto5__step"><span class="ts-howto5__step-title" data-editable="step_5_title">[step_5_title]</span><span class="ts-howto5__step-text" data-editable="step_5_text">[step_5_text]</span></li>
        </ol>
        <a href="#contact" class="ts-btn ts-btn--primary" data-editable="howto_cta">[howto_cta]</a>
      </div>
    </div>
  </div>
</section>
<style>
.ts-howto5 { background: var(--color-bg-alt); padding: var(--spacing-section) var(--spacing-6); }
.ts-howto5__container { max-width: var(--container-max); margin: 0 auto; }
.ts-howto5__header { text-align: center; margin-bottom: var(--spacing-12); }
.ts-howto5__layout { display: grid; grid-template-columns: 3fr 2fr; gap: var(--spacing-12); align-items: start; }
.ts-howto5__video-wrap { position: relative; padding-bottom: 56.25%; border-radius: var(--radius-card); overflow: hidden; box-shadow: var(--shadow-xl); background: var(--color-surface-dark); margin-bottom: var(--spacing-4); }
.ts-howto5__iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
.ts-howto5__video-thumb { position: absolute; inset: 0; cursor: pointer; }
.ts-howto5__video-thumb img { width: 100%; height: 100%; object-fit: cover; }
.ts-howto5__play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 72px; height: 72px; border-radius: 50%; background: var(--color-primary); border: none; color: white; font-size: 24px; cursor: pointer; box-shadow: var(--shadow-xl); transition: transform var(--transition-fast), background var(--transition-fast); }
.ts-howto5__play-btn:hover { transform: translate(-50%,-50%) scale(1.10); background: var(--color-primary-dark); }
.ts-howto5__video-thumb.hidden { display: none; }
.ts-howto5__video-caption { font-family: var(--font-body); font-size: var(--font-size-sm); color: var(--color-text-muted); text-align: center; }
.ts-howto5__intro { font-family: var(--font-body); font-size: var(--font-size-base); color: var(--color-text-muted); line-height: var(--line-height-relaxed); margin: 0 0 var(--spacing-6); }
.ts-howto5__steps { padding-left: 0; list-style: none; margin: 0 0 var(--spacing-8); counter-reset: steps; }
.ts-howto5__step { counter-increment: steps; display: flex; flex-direction: column; padding: var(--spacing-4) 0 var(--spacing-4) var(--spacing-10); border-bottom: 1px solid var(--color-border); position: relative; }
.ts-howto5__step::before { content: counter(steps); position: absolute; left: 0; top: var(--spacing-4); width: 28px; height: 28px; border-radius: 50%; background: var(--color-primary); color: white; display: flex; align-items: center; justify-content: center; font-family: var(--font-body); font-size: var(--font-size-sm); font-weight: var(--font-weight-bold); flex-shrink: 0; }
.ts-howto5__step-title { font-family: var(--font-headers); font-size: var(--font-size-base); font-weight: var(--font-weight-bold); color: var(--color-text); margin-bottom: var(--spacing-1); }
.ts-howto5__step-text { font-family: var(--font-body); font-size: var(--font-size-sm); color: var(--color-text-muted); line-height: var(--line-height-normal); }
@media (max-width: 768px) { .ts-howto5__layout { grid-template-columns: 1fr; } }
</style>
<script>
(function() {
  const thumb = document.getElementById('ts-video-thumb');
  const iframe = document.querySelector('.ts-howto5__iframe');
  thumb?.querySelector('.ts-howto5__play-btn')?.addEventListener('click', function() {
    thumb.classList.add('hidden');
    if (iframe.src && !iframe.src.includes('autoplay=1')) {
      iframe.src = iframe.src + (iframe.src.includes('?') ? '&' : '?') + 'autoplay=1';
    }
  });
})();
</script>

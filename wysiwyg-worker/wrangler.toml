name = "wysiwyg-universal"
main = "index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
VERSION = "2.0.0"

# Secret bindings (set via: wrangler secret put <name>)
# None required — all auth via KV site keys

# KV Namespace bindings
# Create with: wrangler kv namespace create TS_WYSIWYG_KV
# Then add the namespace ID below
[[kv_namespaces]]
binding = "TS_WYSIWYG_KV"
id = "REPLACE_WITH_TS_WYSIWYG_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_TS_WYSIWYG_KV_PREVIEW_NAMESPACE_ID"

[[kv_namespaces]]
binding = "TS_SITES_KV"
id = "REPLACE_WITH_TS_SITES_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_TS_SITES_KV_PREVIEW_NAMESPACE_ID"

[[routes]]
pattern = "wysiwyg.techsites.ai/*"
zone_name = "techsites.ai"

[env.staging]
name = "wysiwyg-universal-staging"
vars = { ENVIRONMENT = "staging" }
